name: build-apk

# 每次推送到 main 自动构建 APK，并发布到仓库的 Releases（tag: app-latest，始终指向最新）
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK with build number
        run: cp app/build/outputs/apk/debug/app-debug.apk EarCap-build-${{ github.run_number }}.apk

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: EarCap-build-${{ github.run_number }}
          path: EarCap-build-${{ github.run_number }}.apk

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: 最新 APK
          body: |
            每次推送代码后自动更新的测试版 APK。
            下载最新 EarCap-build-*.apk 安装即可。
          prerelease: true
          files: EarCap-build-*.apk
