plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.earcap'
    compileSdk 34

    defaultConfig {
        applicationId "com.earcap"
        minSdk 26        // Android 8.0+
        targetSdk 34
        versionCode 5
        versionName "0.5"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

// 刻意保持零第三方依赖：纯系统 API，编译快、APK 小
dependencies {
}
